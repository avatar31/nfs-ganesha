# ganesha.conf

NFS_CORE_PARAM {
    MNT_Port = 20048;
    NFS_Port = 2049;
    FSAL_Path = "./build/FSAL/FSAL_DOTFS";

    # 🌟 1. Enforce NFSv4 only
    Protocols = 4; 
    
    # 🌟 2. Enforce TCP globally
    Transports = TCP; 

    # 🌟 3. Completely shut down UDP listener socket creation
    Enable_UDP = false;

    # 🌟 4. Kill the RQUOTA subsystem (Stops the "RQUOTA V1 on UDP" warning)
    Enable_RQUOTA = false;

    # 🌟 5. Kill the NFSv3 Lock Manager (Not needed for NFSv4)
    Enable_NLM = false;
}

LOG {
    Default_Log_Level = FULL_DEBUG;

    # Modern replacement for Facility block
    FILE {
        name = FILE;
        destination = "/tmp/ganesha.log";
        enable = active;
    }

    Component {
        FSAL = FULL_DEBUG;
        NFS4 = FULL_DEBUG;
        NFS_V3 = FULL_DEBUG;
        CACHE_INODE = FULL_DEBUG;
    }
}

EXPORT {
    Export_Id = 1;
    Path = "/mnt/disk2";      # The real local path we mounted above
    Pseudo = "/xfs_export";   # The virtual path clients use to mount
    Access_Type = RW;
    Disable_ACL = true;
    Squash = No_Root_Squash;

    FSAL {
        Name = DOTFS;
    }
}

NFSv4 {
    RecoveryBackend = "fs";
}
